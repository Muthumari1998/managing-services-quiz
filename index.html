<!doctype html><meta charset="utf-8"><title>Managing Services Online Quiz</title><style>body{font-family:Arial;max-width:850px;margin:30px auto;padding:0 16px}button{padding:12px;margin:6px 0;width:100%;text-align:left;border:1px solid #bbb;border-radius:8px;background:white;cursor:pointer}.correct{background:#d9f7df;border-color:green}.wrong{background:#ffdede;border-color:red}.bar{position:sticky;top:0;background:white;padding:10px 0;border-bottom:1px solid #ddd}#feedback{margin:15px 0;font-weight:bold}.small{color:#666;font-size:13px}</style><div class="bar"><b>Managing Services — Online Quiz</b><span id="score"></span></div><div id="app"></div><script>const qs=[{"q": "Which of the following set of terms best describes a service?", "o": ["Deeds, Efforts, and performances", "Goods, Articles, and Objects", "Goods, Articles, and Efforts", "Deeds, Efforts, and Objects A service is typically characterized by the performance, deeds, efforts that provide value to customers, often in the form of intangible actions or tasks."], "a": 3, "s": "Managing Services_Assignment-1_V2.pdf"}, {"q": "_____________ has high intangible component while ___________________ is high in tangible aspects.", "o": ["Salt, Detergent", "Internet banking, salt", "Consulting, Internet banking", "Detergent, Life Insurance Internet banking has a high intangible component as it involves online interactions and digital services. Salt, on the other hand, is a tangible physical object, so it has a high tangible aspect."], "a": 3, "s": "Managing Services_Assignment-1_V2.pdf"}, {"q": "Which step in the consumer decision-making process involves comparing the offering to expectations and deciding whether it is satisfying or dissatisfying?", "o": ["Need identification", "Information searching", "Post-purchase evaluation", "Alternative evaluation In the consumer decision-making process, the post-purchase evaluation step involves comparing the purchased product or service to the customer's expectations and determining whether it meets those expectations."], "a": 3, "s": "Managing Services_Assignment-1_V2.pdf"}, {"q": "Implementation of GST (Goods and services tax) is an example of change in:", "o": ["Society", "Technology", "Internationalization", "Government Policy A change in taxation-related government policy is involved with the introduction of the GST (Goods and Services Tax). It's a significant policy adjustment that seeks to replace various indirect taxes with a single, unified tax in order to streamline and simplify the taxation system."], "a": 3, "s": "Managing Services_Assignment-1_V2.pdf"}, {"q": "The exchange of services plays a significant role in the global economy. Which of the following statements is false?", "o": ["Services sectors, on average, contribute 60% to the world's GDP.", "Infrastructural services, healthcare, education, recreation, and administrative services are examples of the so-called 'invisibles.'", "", "Discussions on protecting intellectual property rights, barriers to trade, and regulation of international data flows are not significant topics at the World Trade Organization today. Discussions on protecting intellectual property rights, barriers to trade, and regulation of international data flows are not significant topics at the World Trade Organization today is false statement among the following."], "a": 3, "s": "Managing Services_Assignment-1_V2.pdf"}, {"q": "Which of the following statements best describes Product Service Systems (PSS) business models?", "o": ["PSS models combine the provision of both physical products and related services as a bundle.", "PSS models involve the sale of physical products without any associated services.", "PSS models focus solely on providing intangible services without any physical products.", "PSS models exclusively offer services and do not involve the sale of any products. Product Service Systems (PSS) business models involve offering a combination of physical products and related services as a bundled package. This approach is designed to provide customers with a more holistic solution that meets their needs beyond just the physical product itself."], "a": 3, "s": "Managing Services_Assignment-1_V2.pdf"}, {"q": "In addition to the traditional 4Ps (Product, Price, Place, and Promotion), what are the additional 3Ps in the services marketing mix?", "o": ["Profit, Public Relations, and Packaging", "Process, Physical Environment, and People", "Performance, Productivity, and Packaging", "Positioning, Publicity, and Partnerships In services marketing, the additional 3Ps are Process, Physical Environment, and People. These elements are important in shaping the customer's experience and perception of the service being offered."], "a": 3, "s": "Managing Services_Assignment-1_V2.pdf"}, {"q": "Which three management functions are central to meeting the needs of service customers?", "o": ["Operations, Marketing, and Human Resource", "Finance, Marketing, and Human Resource", "Operations, Finance, and Supply Chain", "Operations, Marketing, and Finance These three management functions Operations, Marketing, and Human Resource are central to meeting the needs of service customers. Operations ensure the effective delivery of the service, marketing communicates the value of the service to customers, and human resources are responsible for staffing and training the personnel delivering the service."], "a": 3, "s": "Managing Services_Assignment-1_V2.pdf"}, {"q": "What is the term used for characteristics that customers find difficult to evaluate even after consumption?", "o": ["Search attributes", "Experience attributes", "Credence attributes", "Capital attributes Credence attributes are characteristics of a product or service that are difficult for customers to evaluate, even after consumption. These attributes require a high level of trust and confidence in the provider, as customers may not have the expertise or information to assess them accurately."], "a": 3, "s": "Managing Services_Assignment-1_V2.pdf"}, {"q": "Among the following service situations, in which scenario would customers have the greatest level of involvement or participation?", "o": ["Traveling on an Airplane", "Dining at a local barbecue restaurant", "Attending a symphonic orchestra concert", "Undergoing gall bladder removal surgery Among the given choices, undergoing gall bladder removal surgery would involve the highest level of customer involvement or participation. In this scenario, the patient is an active participant in a complex medical procedure that directly affects their well-being and requires significant decision-making and cooperation with medical professionals."], "a": 3, "s": "Managing Services_Assignment-1_V2.pdf"}, {"q": "Which of the categories under the non-ownership framework of services does “toll roads” fall under?", "o": ["Contractual goods services", "Labor and expertise contracts", "Access to shared physical environments", "Access to and usage of systems and networks"], "a": 2, "s": "Managing Services_Assignment-2_V2.pdf"}, {"q": "In the customer value equation, what does \"Benefits\" refer to?", "o": ["", "", "", ""], "a": 0, "s": "Managing Services_Assignment-2_V2.pdf"}, {"q": "The ____________ is used to illustrate factors that influence service experience, including those that are visible and invisible to the consumer.", "o": ["Servuction model", "Theater Metaphor", "Moments of Truth", "Zone of Tolerance"], "a": 0, "s": "Managing Services_Assignment-2_V2.pdf"}, {"q": "Which dimension of service signifies that service is experientially unique each time and to each consumer?", "o": ["Perishability", "Heterogeneity", "Intangibility", "Inseparability"], "a": 0, "s": "Managing Services_Assignment-2_V2.pdf"}, {"q": "____________ is a tool for simultaneously best depicting the service process flow, the points of customer contacts, and the evidence of service from the customer’s point of view?", "o": ["Service diagram", "Service planning", "Service blueprinting", "Service standardization Service blueprinting is a tool for simultaneously depicting the service process flow, the points of customer contacts, and the evidence of service from the customer's point of view. It helps to understand the end-to-end service delivery process and the interactions and experiences customers have during that process."], "a": 3, "s": "Managing Services_Assignment-2_V2.pdf"}, {"q": "Restaurants typically offer discounts during the weekdays. This is an example of:", "o": ["Increasing number of touchpoints", "Addressing intangibility of services", "Using of Self-service technology", "Stimulating demand in off peak periods Restaurants offering discounts during weekdays is an example of stimulating demand in off-peak periods. This strategy is used to encourage customers to visit and use services during times when there is lower demand in order to even out customer flow and increase overall utilization of resources."], "a": 3, "s": "Managing Services_Assignment-2_V2.pdf"}, {"q": "Which of the following is not an appropriate approach to redesign services?", "o": ["Shift to self service", "Deliver direct service", "Eliminate non value adding steps", "Increase price of service to customers Increasing the price of a service to customers is not necessarily a common or appropriate approach to redesigning services. Redesign efforts typically focus on improving the value proposition, efficiency, and customer experience of the service, and simply raising prices may not align with those goals."], "a": 3, "s": "Managing Services_Assignment-2_V2.pdf"}, {"q": "Service companies that focus primarily on these three strategies are more preferred:", "o": ["Advertising, promotional events, and service quality.", "Customer satisfaction, market research, and service variety.", "Customer satisfaction, service quality and prompt recovery from failure.", "Return on Investment, revenue generation, and service productivity. Customer satisfaction, service quality, and prompt recovery strategies contribute to building strong customer relationships, enhancing the overall customer experience, and maintaining customer loyalty by ensuring that customers are satisfied with the services provided and that any issues are addressed effectively."], "a": 3, "s": "Managing Services_Assignment-2_V2.pdf"}, {"q": "An auto repair service has a coffee machine and magazines in its waiting room and offers pick-up and delivery from customers’ places of work. These are best examples of:", "o": ["", "", "", ""], "a": 0, "s": "Managing Services_Assignment-2_V2.pdf"}, {"q": "All of the following key performance measures are typically the focus of service process redesign initiatives, EXCEPT for which one:", "o": ["Enhanced productivity", "Increased customer satisfaction", "Minimize profitable customer percentage", "Reduced number of service failures Minimizing profitable customer percentage is not a typical key performance measure focused on in service process redesign initiatives."], "a": 3, "s": "Managing Services_Assignment-2_V2.pdf"}, {"q": "Which of the following is an example of stretch and shrink to manage capacity?", "o": ["Queuing system in a salon", "Charge lower price for weekdays in restaurants", "Charge higher price for weekends in cinemas", "Allow passengers to stand while travelling in buses during rush hours Allowing passengers to stand while traveling in buses during rush hours is an example of using stretch and shrink to manage capacity. When there is high demand during peak hours, the capacity of the bus is stretched by allowing passengers to stand, accommodating more people without adding more buses to the fleet. During off-peak hours, the capacity is shrunk as there is less demand and standing passengers might not be allowed."], "a": 3, "s": "Managing Services_Assignment-3_V2.pdf"}, {"q": "Which one of the following is usually the most difficult cost to calculate?", "o": ["Waiting cost", "Service cost", "Material cost", "Facility cost Waiting cost is usually the most difficult cost to calculate. Waiting costs are often indirect and can be challenging to accurately measure and assign a monetary value to, compared to more direct costs like material cost, service cost, and facility cost."], "a": 3, "s": "Managing Services_Assignment-3_V2.pdf"}, {"q": "Which of the following listed below is not according the psychological principles of waiting in line?", "o": ["Unoccupied time feels longer than occupied time", "Occupied time feels longer than unoccupied time", "Uncertain waits are longer than known finite waits", "Unexplained waits are longer than explained waits According to the psychological principles of waiting in line occupied time feels longer than unoccupied time"], "a": 3, "s": "Managing Services_Assignment-3_V2.pdf"}, {"q": "Reliability, ease of use, and customer support are considered as part of ____________.", "o": ["Search attributes", "Luxury attributes", "Experience attributes", "Credence attributes Reliability, ease of use, and customer support are considered as part of experience attributes. Experience attributes are characteristics of a product or service that can only be evaluated after the customer has used or experienced them."], "a": 3, "s": "Managing Services_Assignment-3_V2.pdf"}, {"q": "The difference between which two expectation standards is the zone of tolerance?", "o": ["Desired service, adequate service", "Desired Service, optimal service", "Professional service, adequate service", "Desired service, advance service"], "a": 0, "s": "Managing Services_Assignment-3_V2.pdf"}, {"q": "Customers experience moments of truth during_____________.", "o": ["Pre-purchase stage", "Post-encounter stage", "Service encounter stage", "None of these Customers experience moments of truth during the service encounter stage."], "a": 3, "s": "Managing Services_Assignment-3_V2.pdf"}, {"q": "When customers experience positive disconfirmation, they are likely to:", "o": ["Become indifferent to the brand", "Lower their future expectations", "Complain about the product/service", "Feel satisfied and delighted with the experience Customers experiencing positive disconfirmation are more likely to feel satisfied and delighted with their experience, which can enhance their loyalty and positive word-of-mouth referrals."], "a": 3, "s": "Managing Services_Assignment-3_V2.pdf"}, {"q": "A recently opened dental office has displayed all of the certifications, honors, and affiliations the dentist has received from the relevant regulatory bodies. This is an example of managing intangibility risk in marketing communication through _____________.", "o": ["Advertisement", "Offering guarantee", "Free trial", "Display of credentials Displaying all of the certifications, honors, and affiliations the dentist has received from relevant regulatory bodies is a way of managing the intangibility risk in marketing communication."], "a": 3, "s": "Managing Services_Assignment-3_V2.pdf"}, {"q": "What does the acronym D.A.R.T. model stand for in the context of value co-creation?", "o": ["Dialogue, Access, Rapid assessment, and Transaction", "Dialogue, Access, Risk assessment, and Transparency", "Dialogue, Account, Rate assessment, and Transcendent", "Dialogue, Accord, Rapid assessment, and Transparency"], "a": 0, "s": "Managing Services_Assignment-3_V2.pdf"}, {"q": "Which one of the following statements about self-service technologies is incorrect?", "o": ["Self-service technologies are suitable for all types of service deliveries", "Self-service technologies require high levels of customer involvement", "Self-service technologies allow convenience of location and time saving to customers", "Inexperienced customers may feel stress and anxiety while using self-service technologies Self-service technologies are not suitable for all types of service deliveries. While they are beneficial for certain types of routine and standardized services, they might not be appropriate for services that require a high degree of personalization, human interaction, or complex decision-making."], "a": 3, "s": "Managing Services_Assignment-3_V2.pdf"}, {"q": "The correct sequence of activities for designing a new service as a process is (from left to right):", "o": ["Service strategy, service blueprint, supporting processes, service concept", "Service concept, Service blueprint, service strategy, supporting processes", "Service blueprint, service strategy, supporting processes, service concept", "Service strategy, service concept, service blueprint, supporting processes"], "a": 0, "s": "Managing Services_Assignment-4_V2.pdf"}, {"q": "An organization can be said to be following a _____________ strategy if it provides a wide range of services to a limited number of markets.", "o": ["Unfocused", "Service focused", "Market focused", "Fully focused In a market-focused strategy, an organization concentrates its efforts on serving a limited number of markets with a wide range of services tailored to the specific needs and preferences of those markets."], "a": 3, "s": "Managing Services_Assignment-4_V2.pdf"}, {"q": "Positioning map in services will helps to:", "o": ["Know-how the brand is perceived by customers among other players in the market.", "Identify the position of the company on the world map.", "Identify the position of the company on the industry map.", "Identify the position of the company on the local map. A positioning map in services helps an organization understand how its brand or service is perceived by customers relative to other competitors in the market. It provides insights into how customers view different attributes or characteristics of services and how the services compare with those of other players in the industry."], "a": 3, "s": "Managing Services_Assignment-4_V2.pdf"}, {"q": "Which one is not the feature of Production Line approach to Service design?", "o": ["Division of Labor", "Augmenting people by technology", "Substitution of technology by people", "Service Standardization"], "a": 1, "s": "Managing Services_Assignment-4_V2.pdf"}, {"q": "Which one of the following is the tri-part mantra of Aravind Eye Hospital service model:", "o": ["High volume, Low quality, and High cost", "Low volume, high quality, and affordable cost", "High volume, high quality, and affordable cost", "High volume, Low quality, and affordable cost"], "a": 2, "s": "Managing Services_Assignment-4_V2.pdf"}, {"q": "Which of the following aspects is a characteristic of Theory Z management philosophy?", "o": ["Short-term employment and high turnover.", "Strict hierarchical structures and top-down decision-making.", "Emphasis on individual performance metrics.", "Long-term employment and participative decision-making. Theory Z management philosophy emphasizes long-term employment relationships and participative decision-making."], "a": 3, "s": "Managing Services_Assignment-4_V2.pdf"}, {"q": "Outcome of the “Cycle of Failure” for firms includes_____________and _____________.", "o": ["low service quality, low employee turnover", "low service quality, high employee turnover", "high service quality, low employee turnover", "high service quality, high employee turnover"], "a": 3, "s": "Managing Services_Assignment-4_V2.pdf"}, {"q": "Which leadership approach involves providing guidance, clear instructions, and specific expectations to team members?", "o": ["Delegation", "Coaching", "Directing", "Supporting"], "a": 0, "s": "Managing Services_Assignment-4_V2.pdf"}, {"q": "What is the primary focus of the People Capability Maturity Model (PCMM)?", "o": ["Evaluating financial performance within an organization.", "Assessing technological infrastructure and IT systems.", "Enhancing the maturity of an organization's workforce practices and processes.", "Analyzing market trends and customer preferences."], "a": 2, "s": "Managing Services_Assignment-4_V2.pdf"}, {"q": "Which of the following characteristics is best associated with a Level 5 Leader?", "o": ["Strong charisma and self-promotion.", "Quick decision-making without consulting the team.", "Humility and a focus on organizational success.", "Micromanaging team members for optimal results. Level 5 Leadership is characterized by humility and a focus on the success of the organization rather than individual ego."], "a": 3, "s": "Managing Services_Assignment-4_V2.pdf"}, {"q": "What is the key focus of positioning for a service business?", "o": ["Creating a physical product", "Highlighting tangible features", "Addressing customer needs and pain points", "Minimizing customer interaction Positioning for a service business involves understanding the needs and pain points of customers and tailoring the service offering to meet those needs effectively. It is about identifying the unique value proposition of the service and communicating that to the target audience in a way that resonates with their specific needs and desires. This goes beyond creating a physical product or highlighting tangible features, and also involves actively engaging with customers to address their needs and pain points."], "a": 3, "s": "Managing Services_Assignment-5_V2.pdf"}, {"q": "Which positioning strategy emphasizes on providing a narrow range of services to a fairly broad market?", "o": ["Market-Focused Positioning", "Fully Focused Positioning", "Unfocused Positioning", "Service-Focused Positioning Service-focused positioning refers to a strategy where a service business emphasizes providing a narrow range of services to a fairly broad market. Instead of offering a wide variety of services, the business chooses to specialize in a specific set of services and become known for its expertise in that area. This allows the business to differentiate itself from competitors and cater to the specific needs of its target market."], "a": 3, "s": "Managing Services_Assignment-5_V2.pdf"}, {"q": "What is the objective of \"Distinctive STP\"?", "o": ["To stand out and be unique in each marketing stage", "To mimic competitors' strategies for better results", "To minimize the importance of target audience preferences", "To adopt generic marketing approaches for broader appeal Distinctive STP refers to the practice of creating a unique and differentiated positioning strategy by segmenting the market, targeting specific customer segments, and positioning the brand or product in a way that stands out from competitors."], "a": 3, "s": "Managing Services_Assignment-5_V2.pdf"}, {"q": "How do \"Determinant Attributes\" affect consumers' purchasing decisions?", "o": ["They have no impact on consumer choices.", "They heavily influence consumers' choices and lead to preference.", "They are only relevant for luxury products.", "They are only considered by price-sensitive consumers. Determinant attributes are product or service features that are considered important by consumers when making purchasing decisions. These attributes heavily influence consumer’s choices and preferences. Consumers carefully evaluate and compare different products or services based on these determinants to make informed decisions."], "a": 3, "s": "Managing Services_Assignment-5_V2.pdf"}, {"q": "What does positioning link together in strategic planning?", "o": ["Market analysis and competitor collaboration", "Internal corporate analysis and product development", "Market analysis and competitive analysis to internal corporate analysis", "Customer feedback and employee satisfaction Positioning links together market analysis and competitive analysis to internal corporate analysis in strategic planning."], "a": 3, "s": "Managing Services_Assignment-5_V2.pdf"}, {"q": "What does the Shostack Continuum illustrate?", "o": ["", "", "", ""], "a": 0, "s": "Managing Services_Assignment-5_V2.pdf"}, {"q": "In which brand development approach does a company introduce a new product within an existing product line and target an existing market using the current brand name?", "o": ["Multi-Brand", "Brand Extension", "New Brand", "Product Line Extension In a product line extension approach, a company introduces a new product within an existing product line and targets an existing market using the current brand name. This strategy allows the company to leverage the existing brand equity and customer awareness associated with the current brand to introduce a new offering."], "a": 3, "s": "Managing Services_Assignment-5_V2.pdf"}, {"q": "Which industry commonly utilizes a hub and spoke network for service delivery?", "o": ["Agriculture", "Manufacturing", "Logistics and transportation", "Information technology"], "a": 2, "s": "Managing Services_Assignment-5_V2.pdf"}, {"q": "What is the primary focus of strategic thinking?", "o": ["Immediate problem-solving and tactical decisions.", "Short-term goals and daily operational tasks.", "Analyzing historical data for decision-making.", "Long-term planning and creating a sustainable competitive advantage. Strategic thinking involves taking a broader perspective and considering the long-term goals and objectives of an organization. It involves analyzing trends, gathering insights, and making decisions that will position the organization for long-term success and competitive advantage."], "a": 3, "s": "Managing Services_Assignment-6_V2.pdf"}, {"q": "Which of the following is not an example of Strategic Objective of an organization?", "o": ["Increase market share from 20 to 25% in 5 years", "Buy back company shares through current open market deals", "Overtake rivals on quality of customer service by 2030", "Attain lower overall costs than rivals by 2030 Among the given options, buy back company shares through current open market deals is not typically considered a strategic objective."], "a": 3, "s": "Managing Services_Assignment-6_V2.pdf"}, {"q": "The TOWS Matrix is a strategic planning tool that:", "o": ["Focuses exclusively on internal strengths and weaknesses.", "Assesses market trends without considering internal factors.", "Matches external opportunities with internal strengths.", "Exclusively addresses threats in the external environment."], "a": 1, "s": "Managing Services_Assignment-6_V2.pdf"}, {"q": "Which one of the following statements is not a part of external influences in a situational analysis of an organization?", "o": ["Industry’s dominant economic traits", "Competitive forces", "Turnover of labour in an organization", "Industry attractiveness Among the given options, turnover of labour in an organization is not related to external factors or the environment."], "a": 3, "s": "Managing Services_Assignment-6_V2.pdf"}, {"q": "In Porter's Five Forces model, which of the following accurately characterizes the \"Rivalry among Sellers\" force?", "o": ["It primarily focuses on potential new entrants to the industry.", "It assesses the strength of suppliers' bargaining power.", "It pertains to the threat of substitute products or services.", "It evaluates the level of competition and aggressiveness among existing competitors. In Porter's Five Forces model, the"], "a": 3, "s": "Managing Services_Assignment-6_V2.pdf"}, {"q": "Which of the following competitive strategies focuses on offering unique and high- quality products or services targeted at a specific market segment?", "o": ["Overall low-cost leadership strategy", "Broad differentiation strategy", "Focused low-cost strategy", "Focused differentiation strategy A focused differentiation strategy focuses on offering unique and high-quality products or services targeted at a specific market segment. This strategy involves tailoring products or services to meet the specific needs and preferences of a particular group of customers."], "a": 3, "s": "Managing Services_Assignment-6_V2.pdf"}, {"q": "Which of the following is an example of a fixed cost?", "o": ["Cost of raw materials", "Lease rent of warehouses", "Sales commission based on volume of sales", "None of these Lease rent of warehouses is an example of a fixed cost because it remains the same regardless of the amount of goods stored in the warehouse or the level of sales. This cost is incurred regularly and does not change in the short term."], "a": 3, "s": "Managing Services_Assignment-6_V2.pdf"}, {"q": "In which type of pricing strategy, the setting of price depends on the price leader in the industry?", "o": ["Cost based pricing", "Value base pricing", "Competition based pricing", "None of these Competition based pricing is a strategy in which an organization sets its prices based on the prices set by its competitors in the industry. In this approach, the organization closely monitors and analyzes the pricing decisions of its competitors and adjusts its own prices accordingly."], "a": 3, "s": "Managing Services_Assignment-6_V2.pdf"}, {"q": "Which of the following is an example of transaction characteristic related rate fence?", "o": ["Discounts to students or children", "Change in price based on time of booking", "Group discounts based on size of groups", "Having different classes of travel like business, economy etc. A rate fence is a pricing strategy used in revenue management to offer different prices for the same product or service based on specific characteristics or conditions. In the context of transaction characteristics, a rate fence could be based on factors such as time of booking, length of stay, or other specific conditions. Therefore, the correct option is Change in price based on time of booking."], "a": 3, "s": "Managing Services_Assignment-6_V2.pdf"}, {"q": "The price elasticity of demand measures:", "o": ["", "How often the price of a good changes.", "How sensitive the quantity demanded is to changes in ambient weather.", ""], "a": 2, "s": "Managing Services_Assignment-6_V2.pdf"}, {"q": "Which dimension of service quality involves the ability of a service provider to consistently deliver accurate and dependable services?", "o": ["Reliability", "Assurance", "Empathy", "Responsiveness"], "a": 0, "s": "Managing Services_Assignment-7_V2.pdf"}, {"q": "What is the key difference between \"Expected Service\" and \"Perceived Service\"?", "o": ["Expected Service refers to services that are delivered consistently, while Perceived Service is a one-time occurrence.", "Expected Service is the service level customers anticipate, while Perceived Service is the actual service they experience.", "Expected Service is associated with tangible aspects, while Perceived Service is related to intangible aspects.", "Expected Service is only relevant for physical products, while Perceived Service applies to services only."], "a": 1, "s": "Managing Services_Assignment-7_V2.pdf"}, {"q": "What is the primary distinction between \"Customer Feedback\" and \"Word of Mouth\" in the context of business?", "o": ["Customer Feedback involves unsolicited opinions, while Word of Mouth is solicited through surveys.", "Customer Feedback is collected through social media, while Word of Mouth is collected through customer support channels.", "Customer Feedback refers to positive comments, while Word of Mouth refers to negative comments.", "Customer Feedback is communicated directly to the company, while Word of Mouth involves customers sharing opinions with others."], "a": 1, "s": "Managing Services_Assignment-7_V2.pdf"}, {"q": "In Quality Function Deployment (QFD), what is the purpose of the \"House of Quality\" matrix?", "o": ["To prioritize company objectives", "To visualize the production process", "To map out the competition's strategies", "To link customer requirements with technical features"], "a": 3, "s": "Managing Services_Assignment-7_V2.pdf"}, {"q": "Which type of measure is based on tangible and objective data, often quantifiable, to assess various operational aspects of service quality?", "o": ["Soft Measures", "Hard Measures", "Subjective Measures", "Emotional Measures"], "a": 0, "s": "Managing Services_Assignment-7_V2.pdf"}, {"q": "Cause and Effect Charts, also known as Fishbone Diagrams, are primarily used for:", "o": ["Identifying potential customers", "Analyzing financial statements", "Mapping out project timelines", "Identifying root causes of problems Cause and Effect Charts, also known as Fishbone Diagrams or Ishikawa Diagrams, are primarily used for identifying the root causes of problems. This tool helps to visually organize and analyze the various potential causes that contribute to a specific problem or effect."], "a": 3, "s": "Managing Services_Assignment-7_V2.pdf"}, {"q": "In the context of service recovery, why is the \"Speed of Recovery\" important?", "o": ["It helps organizations save costs on compensation.", "It demonstrates the organization's technological expertise", "It minimizes negative customer emotions and dissatisfaction.", "It showcases the organization's commitment to legal requirements. In the context of service recovery, the"], "a": 3, "s": "Managing Services_Assignment-7_V2.pdf"}, {"q": "Interactional justice in customer responses to service failure primarily concerns:", "o": ["", "", "", ""], "a": 0, "s": "Managing Services_Assignment-7_V2.pdf"}, {"q": "What is the key difference between Customer Loyalty and Customer Advocacy?", "o": ["Customer Loyalty involves occasional purchases, while Customer Advocacy involves frequent purchases.", "Customer Loyalty refers to customers engaging with the brand on social media, while Customer Advocacy involves recommending the brand to others.", "Customer Loyalty is characterized by consistent brand preference, while Customer Advocacy means customers actively promoting the brand to others.", "Customer Loyalty is driven by discounts and promotions, while Customer Advocacy is driven by brand awareness."], "a": 1, "s": "Managing Services_Assignment-7_V2.pdf"}, {"q": "What is the purpose of the \"Create Loyalty Bonds\" stage in the \"Wheel of Loyalty\"?", "o": ["To attract new customers to the brand.", "To identify and address factors that could lead to customer churn.", "To establish a strong foundation for
